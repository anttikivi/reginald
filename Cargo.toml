[package]
name = "reginald"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88.0"
description = "The personal workstation valet"
repository = "https://github.com/anttikivi/reginald"
license = "GPL-3.0-or-later"
build = "build.rs"
exclude = [".cargo", ".github", "deny.toml", "renovate.json"]
publish = false                                               # TODO: remove when ready to publish

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.3", default-features = false, features = [
  "std",
  "serde",
  "parse",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
git2 = { version = "0.21.0", default-features = false }
jiff = "1.0.3"
semver = "1.0.28"
serde_json = "1.0.154"
versolve = "0.4.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[lints]
workspace = true

[workspace]
members = [".", "xtask"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"    # "warn" if we add a library for some reason
unused_must_use = "warn"
unreachable_pub = "allow" # "warn" if we add a library for some reason

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
excessive_nesting = "warn"
exit = "warn"
expect_used = "warn"
host_endian_bytes = "warn"
implicit_return = "allow"
indexing_slicing = "warn"
lossy_float_literal = "warn"
missing_assert_message = "warn"
panic = "warn"
panic_in_result_fn = "warn"
rest_pat_in_fully_bound_structs = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
