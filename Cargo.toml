[package]
name = "reginald"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88.0"
description = "The personal workstation valet"
repository = "https://github.com/anttikivi/reginald"
license = "GPL-3.0-or-later"
build = "build.rs"
exclude = [".cargo", ".github", "deny.toml", "renovate.json"]
publish = false                                               # TODO: remove when ready to publish

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.3", default-features = false, features = [
  "std",
  "serde",
  "parse",
] }

[build-dependencies]
git2 = { version = "0.21.0", default-features = false }
jiff = "1.0.3"
semver = "1.0.28"
serde_json = "1.0.154"
versolve = "0.4.1"

[workspace]
members = [".", "xtask"]

[dev-dependencies]
tempfile = "=3.27.0"
