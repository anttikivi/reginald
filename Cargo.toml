[package]
name = "reginald"
version = "0.1.0-dev"
edition = "2024"
description = "The personal workstation valet"
repository = "https://github.com/anttikivi/reginald"
license = "GPL-3.0-or-later"
build = "build.rs"
exclude = [".cargo", ".github", "deny.toml", "renovate.json"]
publish = false                                               # TODO: remove when ready to publish

[workspace]
members = [".", "xtask"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4.35"

[build-dependencies]
git2 = { version = "0.21.0", default-features = false }
jiff = "1.0.3"
semver = "1.0.28"
serde_json = "1.0.154"
versolve = "0.4.0"
